# Configuração comercial dos workshops AtlasHub.SI para o ARO (Atlas Revenue Operations).
# Formato: atlashub-digital/atlashub-finance schemas/project-commerce-manifest.schema.json
# Estado: OFERTAS ATIVAS no ARO (projeto `atlashub-si` registado; ARO em https://aro.atlashub.si).
# Estes códigos/valores refletem o catálogo ARO em produção — fonte única dos preços
# (lib/workshop-commerce.ts). Direitos curtos `atlashub-si:w01` / `atlashub-si:el01`
# conforme emitidos no ARO. Alterações de preço passam primeiro pelo ARO, depois aqui.
version: "1"

project:
  slug: atlashub-si
  name: AtlasHub.SI — Enterprise Transformation
  default_market: BR
  default_currency: BRL

products:
  - code: workshop-01-empresa-aumentada
    name: Workshop 01 — Empresa Aumentada 2027–2030 (14/11/2026, Anápolis)
    type: other
  - code: enterprise-lab-01-ecommerce
    name: Enterprise Lab 01 — E-commerce e Operações Vivas (28/11/2026, Anápolis)
    type: other

offers:
  - code: workshop-01-empresa-aumentada-antecipado-br
    name: Workshop 01 — lote antecipado (bilhete individual)
    products: [workshop-01-empresa-aumentada]
    market: BR
    currency: BRL
    amount_minor: 29700
    cadence: once
    payment_methods: [PIX]
    entitlements: [atlashub-si:w01]
    status: active
  - code: workshop-01-empresa-aumentada-regular-br
    name: Workshop 01 — regular (bilhete individual)
    products: [workshop-01-empresa-aumentada]
    market: BR
    currency: BRL
    amount_minor: 34700
    cadence: once
    payment_methods: [PIX]
    entitlements: [atlashub-si:w01]
    status: active
  - code: enterprise-lab-01-ecommerce-antecipado-br
    name: Enterprise Lab 01 — lote antecipado (por empresa, 1 representante)
    products: [enterprise-lab-01-ecommerce]
    market: BR
    currency: BRL
    amount_minor: 99000
    cadence: once
    payment_methods: [PIX]
    entitlements: [atlashub-si:el01]
    status: active
  - code: enterprise-lab-01-ecommerce-regular-br
    name: Enterprise Lab 01 — regular (por empresa, 1 representante)
    products: [enterprise-lab-01-ecommerce]
    market: BR
    currency: BRL
    amount_minor: 129000
    cadence: once
    payment_methods: [PIX]
    entitlements: [atlashub-si:el01]
    status: active

fulfillment:
  - entitlement: atlashub-si:w01
    type: none
  - entitlement: atlashub-si:el01
    type: none
